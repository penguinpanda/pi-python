[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-ai"
version = "0.1.0"
description = "Pi monorepo: Unified LLM API (pi-ai) + Agent core loop (pi-agent) — Python port for learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pengupanda" }]
keywords = ["ai", "llm", "openai", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai", "src/pi_agent", "src/pi_coding_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/pi_ai/tests", "src/pi_agent/tests", "src/pi_coding_agent/tests"]
pythonpath = ["src", "."]
addopts = "--cov=pi_ai --cov=pi_agent --cov=pi_coding_agent --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
# 只统计 src 下的包代码，不统计测试自身。
omit = ["src/pi_ai/tests/*", "src/pi_agent/tests/*", "src/pi_coding_agent/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
