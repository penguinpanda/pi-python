[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-ai"
version = "0.1.0"
description = "Pi monorepo Python port: unified LLM API (pi-ai), agent loop (pi-agent), coding agent CLI/TUI, protocol v2, storage, server, evals — for learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pengupanda" }]
keywords = ["ai", "llm", "openai", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "python-dotenv>=1.2.2",
    "filelock>=3.12",
    "rich>=13.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "typing-extensions>=4.5",
    "asyncpg>=0.29",
    "pyyaml>=6.0.3",
    "pathspec>=1.1.1",
]

[project.scripts]
pi-ai = "pi_ai.cli:main"
pi-python = "pi_coding_agent._cli:main"
pi-evals = "pi_evals.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/pi_ai",
    "src/pi_agent",
    "src/pi_coding_agent",
    "src/pi_tui",
    "src/pi_telemetry",
    "src/pi_protocol",
    "src/pi_storage",
    "src/pi_server",
    "src/pi_evals",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests/parity",
    "tests/golden",
    "src/pi_ai/tests",
    "src/pi_agent/tests",
    "src/pi_coding_agent/tests",
    "src/pi_protocol/tests",
    "src/pi_storage/tests",
    "src/pi_server/tests",
    "src/pi_evals/tests",
    "src/pi_tui/tests",
    "src/pi_telemetry/tests",
]
pythonpath = ["src", "."]

[tool.coverage.run]
# 只统计 src 下的包代码，不统计测试自身。
omit = [
    "src/pi_ai/tests/*",
    "src/pi_agent/tests/*",
    "src/pi_coding_agent/tests/*",
    "src/pi_protocol/tests/*",
    "src/pi_storage/tests/*",
    "src/pi_server/tests/*",
    "src/pi_evals/tests/*",
    "src/pi_tui/tests/*",
    "src/pi_telemetry/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# 以下文件出于平台/测试原因需要延迟导入（sys.path 调整、可选依赖）。
"src/pi_ai/_types.py" = ["E402"]
"src/pi_ai/tests/test_completions_unit.py" = ["E402"]
"src/pi_ai/tests/test_responses_unit.py" = ["E402"]
"src/pi_ai/utils/_event_stream.py" = ["E402"]
"src/pi_agent/env.py" = ["E402"]
"src/pi_agent/session_resources.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = false
exclude = "(tests|generated|src/pi_coding_agent/examples)/"
