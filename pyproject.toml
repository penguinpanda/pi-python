[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-ai"
version = "0.1.0"
description = "Unified LLM API with provider abstraction — Python port for learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pengupanda" }]
keywords = ["ai", "llm", "openai", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/pi_ai/tests"]
addopts = "--cov=pi_ai --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
# 只统计 src 下的包代码，不统计测试自身。
omit = ["src/pi_ai/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true